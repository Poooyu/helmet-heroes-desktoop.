name: Build Helmet Heroes Windows EXE

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Build EXE
        run: npm run dist
        working-directory: source

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Helmet-Heroes-Windows
          path: source/dist/*.exe
